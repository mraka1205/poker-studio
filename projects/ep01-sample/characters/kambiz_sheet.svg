<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <circle cx="200" cy="160" r="90" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  <text x="200" y="180" font-size="70" text-anchor="middle">📋</text>
  
  <!-- Badge -->
  <rect x="80" y="270" width="240" height="34" rx="17" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="293" font-family="sans-serif" font-weight="bold" font-size="14" fill="#f8fafc" text-anchor="middle">3-Angle Consistency</text>
  
  <text x="200" y="340" font-family="sans-serif" font-weight="bold" font-size="22" fill="#ffffff" text-anchor="middle">کامبیز فوتوشیت</text>
  <text x="200" y="370" font-family="sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Full Turnaround Sheet • 3 Angles + 3 Expressions</text>
</svg>